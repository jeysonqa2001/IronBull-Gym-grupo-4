<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronBull Gym</title>

  <!-- Aplica el tema guardado antes de pintar la página -->
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("tema"); } catch (e) {}
      if (!tema) {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">IronBull Gym</h1>

    <nav id="menu" class="menu" aria-label="Menú principal">
      <a href="#inicio">Inicio</a>
      <a href="#planes">Planes</a>
      <a href="#horarios">Horarios</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <div class="acciones">
      <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">Modo oscuro</button>
      <button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">☰</button>
    </div>
  </header>

  <main>

    <section id="inicio" class="hero">
      <div class="hero-texto">
        <h2>Fuerza real, rutina real.</h2>
        <p>Sala de pesas, clases grupales y entrenadores que te guían desde el primer día.</p>
        <a href="#contacto" class="btn">Quiero inscribirme</a>
      </div>
      <div class="plate" aria-hidden="true"></div>
    </section>

    <section id="planes" class="seccion"><h2>Planes</h2></section>
    <section id="horarios" class="seccion"><h2>Horarios</h2></section>
    <section id="contacto" class="seccion"><h2>Contacto</h2></section>

  </main>

  <footer class="footer"><p>Gimnasio IronBull</p></footer>

  <script src="script.js"></script>
</body>
</html>
